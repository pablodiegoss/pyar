 {% load static %}
<html>
<head>
    <title>Home</title>
    <link rel="stylesheet" href="{% static 'main.css' %}">
</head>
<body>
    <div id="main-view">
        <div id="video-container">
          <video id="front-camera" autoplay="" playsinline="" muted=""></video>
          <canvas id="three-canvas"></canvas>
        </div>
        <div id="canvas-container">
            <canvas id="output-canvas"></canvas>
        </div>
      
      <ar-marker src="{% static 'markers/gueixa_no_border.png' %}">
          <ar-content src="{% static 'objects/temaki.png' %}" type="gif" metadata="{% static 'objects/temaki.json' %}"></ar-content>
      </ar-marker>
      <ar-marker src="{% static 'markers/glenda.png' %}">
          <ar-content src="{% static 'markers/gueixa_no_border.png' %}" type="img"></ar-content>
      </ar-marker>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "{% static 'three-js/three-0.184.0.js' %}"
        }
    }
    </script>
    <p id="status">Waiting for OpenCV...</p>
    <div id="controls-panel">
        <h3>Runtime Tuning</h3>
        <div id="controls-grid">
            <div class="control-item"><label for="ctrl-warp-size">Warp Size</label><input id="ctrl-warp-size" type="range" min="64" max="256" step="8"><span id="val-warp-size" class="control-value"></span></div>
            <div class="control-item"><label for="ctrl-border-size">Border Size</label><input id="ctrl-border-size" type="range" min="4" max="64" step="1"><span id="val-border-size" class="control-value"></span></div>
            <div class="control-item"><label for="ctrl-epsilon-coeff">Epsilon Coeff</label><input id="ctrl-epsilon-coeff" type="range" min="0.01" max="0.05" step="0.005"><span id="val-epsilon-coeff" class="control-value"></span></div>
            <div class="control-item"><label for="ctrl-min-area">Min Area</label><input id="ctrl-min-area" type="range" min="200" max="2000" step="50"><span id="val-min-area" class="control-value"></span></div>
            <div class="control-item"><label for="ctrl-max-side-ratio">Max Side Ratio</label><input id="ctrl-max-side-ratio" type="range" min="1.0" max="10.0" step="0.1"><span id="val-max-side-ratio" class="control-value"></span></div>
            <div class="control-item"><label for="ctrl-black-border-threshold">Black Border Threshold</label><input id="ctrl-black-border-threshold" type="range" min="0.5" max="0.95" step="0.05"><span id="val-black-border-threshold" class="control-value"></span></div>
            <div class="control-item"><label for="ctrl-binary-threshold">Binary Threshold</label><input id="ctrl-binary-threshold" type="range" min="0" max="255" step="1"><span id="val-binary-threshold" class="control-value"></span></div>
            <div class="control-item checkbox"><label for="ctrl-use-otsu">Use Otsu</label><input id="ctrl-use-otsu" type="checkbox"></div>
            <div class="control-item"><label for="ctrl-temporal-confirm-frames">Temporal Confirm Frames</label><input id="ctrl-temporal-confirm-frames" type="range" min="1" max="8" step="1"><span id="val-temporal-confirm-frames" class="control-value"></span></div>
            <div class="control-item"><label for="ctrl-track-stale-frames">Track Stale Frames</label><input id="ctrl-track-stale-frames" type="range" min="2" max="12" step="1"><span id="val-track-stale-frames" class="control-value"></span></div>
            <div class="control-item"><label for="ctrl-center-track-threshold">Center Track Threshold</label><input id="ctrl-center-track-threshold" type="range" min="10" max="200" step="1"><span id="val-center-track-threshold" class="control-value"></span></div>
            <div class="control-item"><label for="ctrl-centroid-grid">Centroid Grid</label><input id="ctrl-centroid-grid" type="range" min="4" max="32" step="1"><span id="val-centroid-grid" class="control-value"></span></div>
            <div class="control-item"><label for="ctrl-process-every-n-frames">Process Every N Frames</label><input id="ctrl-process-every-n-frames" type="range" min="1" max="4" step="1"><span id="val-process-every-n-frames" class="control-value"></span></div>
        </div>
    </div>
    <canvas id="debug-canvas" style="border: 1px solid #ccc; margin-top: 10px; display: none;"></canvas>
    <script src="{% static 'ar-detection-utils.js' %}"></script>
    <script src="{% static 'debug-ui.js' %}"></script>
    <script>
        const RENDER_WIDTH = 640;
        const RENDER_HEIGHT = 480;

        const videoEl = document.getElementById('front-camera');
        const canvasEl = document.getElementById('output-canvas');
        const threeCanvasEl = document.getElementById('three-canvas');
        const debugCanvasEl = document.getElementById('debug-canvas');
        const debugCtx = debugCanvasEl.getContext('2d');
        const statusEl = document.getElementById('status');
        const ctx = canvasEl.getContext('2d');

        // Set canvas sizes immediately from constants
        canvasEl.width = RENDER_WIDTH;
        canvasEl.height = RENDER_HEIGHT;
        threeCanvasEl.width = RENDER_WIDTH;
        threeCanvasEl.height = RENDER_HEIGHT;
        
        const DEFAULTS = {
            warpSize: 128,
            borderSize: 26,
            temporalConfirmFrames: 4,
            trackStaleFrames: 60,
            centerTrackThreshold: 60,
            centroidGrid: 50,
            minArea: 500,
            epsilonCoeff: 0.025,
            blackBorderThreshold: 0.65,
            processEveryNFrames: 1,
            binaryThreshold: 160,
            useOtsu: true,
            maxSideRatio: 2.0,
            edgeMarginPx: 10
        };

        const config = { ...DEFAULTS };

        const DEBUG_MODE = true;
        const DEBUG_GRID_SIZE = 6;
        const DEBUG_DISPLAY_SIZE = 128;

        let mediaStream = null;
        let animationId = null;
        let started = false;
        let frameNumber = 0;

        const tracks = new Map();
        const debugWarps = [];
        const MATCH_THRESHOLD = 0.7;
        let templateCache = [];
        let templateCacheWarpSize = null;

    
        function setStatus(text) {
            statusEl.textContent = text;
        }

        function getApproxCenter(approx) {
            let cx = 0;
            let cy = 0;
            for (let i = 0; i < 4; i++) {
                cx += approx.data32S[i * 2];
                cy += approx.data32S[i * 2 + 1];
            }
            return { x: cx / 4, y: cy / 4 };
        }

        function centerDistance(a, b) {
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function makeMarkerId() {
            let id = '';
            while (id.length < 8) {
                id += Math.random().toString(16).slice(2);
            }
            return id.slice(0, 8);
        }

        function makeUniqueMarkerId() {
            let markerId = makeMarkerId();
            while (tracks.has(markerId)) {
                markerId = makeMarkerId();
            }
            return markerId;
        }

        function findNearestTrackId(center, claimedTrackIds) {
            let bestTrackId = null;
            let bestDistance = Infinity;

            for (const [trackId, track] of tracks.entries()) {
                if (claimedTrackIds.has(trackId)) {
                    continue;
                }
                const distance = centerDistance(center, track.center);
                if (distance <= config.centerTrackThreshold && distance < bestDistance) {
                    bestDistance = distance;
                    bestTrackId = trackId;
                }
            }

            return bestTrackId;
        }

        function updateTrack(trackId, approx, center) {
            const prev = tracks.get(trackId);
            if (!prev) {
                tracks.set(trackId, {
                    id: trackId,
                    consecutive: 1,
                    lastSeen: frameNumber,
                    approx: approx.clone(),
                    center,
                    match: null
                });
                return;
            }

            prev.consecutive = prev.lastSeen === frameNumber - 1 ? prev.consecutive + 1 : 1;
            prev.lastSeen = frameNumber;
            prev.approx.delete();
            prev.approx = approx.clone();
            prev.center = center;
        }

        function drawTrackLabels() {
            if (!DEBUG_MODE) {
                return;
            }

            ctx.save();
            ctx.font = '12px monospace';
            ctx.textBaseline = 'top';

            for (const track of tracks.values()) {
                const x = Math.max(0, Math.min(canvasEl.width - 180, Math.round(track.center.x) + 8));
                const y = Math.max(0, Math.min(canvasEl.height - 30, Math.round(track.center.y) - 14));
                const label = `${track.id} (${Math.round(track.center.x)},${Math.round(track.center.y)})`;
                const width = Math.ceil(ctx.measureText(label).width) + 8;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(x, y, width, 18);
                ctx.fillStyle = '#7fffd4';
                ctx.fillText(label, x + 4, y + 3);
            }

            ctx.restore();
        }

        function clearTemplateCache() {
            for (const template of templateCache) {
                template.mat.delete();
            }
            templateCache = [];
            templateCacheWarpSize = null;
        }

        function getTemplateCandidates() {
            if (templateCacheWarpSize === config.warpSize && templateCache.length > 0) {
                return templateCache;
            }

            clearTemplateCache();

            const imageElements = Array.from(document.querySelectorAll('ar-marker'));
            for (const markerEl of imageElements) {
                const imgEl = markerEl._markerImg;
                if (!imgEl || !imgEl.complete || imgEl.naturalWidth === 0) continue;

                const templateMat = cv.imread(imgEl, cv.IMREAD_COLOR);
                if (templateMat.empty()) {
                    templateMat.delete();
                    continue;
                }

                cv.resize(templateMat, templateMat, new cv.Size(config.warpSize, config.warpSize));
                templateCache.push({
                    id: markerEl.markerId,
                    mat: templateMat
                });
            }

            templateCacheWarpSize = config.warpSize;
            return templateCache;
        }

        function buildRotations(baseMat) {
            const rotations = [
                { degrees: 0, mat: baseMat.clone() }
            ];

            const rotate90 = new cv.Mat();
            cv.rotate(baseMat, rotate90, cv.ROTATE_90_CLOCKWISE);
            rotations.push({ degrees: 90, mat: rotate90 });

            const rotate180 = new cv.Mat();
            cv.rotate(baseMat, rotate180, cv.ROTATE_180);
            rotations.push({ degrees: 180, mat: rotate180 });

            const rotate270 = new cv.Mat();
            cv.rotate(baseMat, rotate270, cv.ROTATE_90_COUNTERCLOCKWISE);
            rotations.push({ degrees: 270, mat: rotate270 });

            return rotations;
        }

        function findBestTemplateMatch(markerMat) {
            const templates = getTemplateCandidates();
            if (templates.length === 0) {
                return null;
            }

            const rotations = buildRotations(markerMat);
            let bestMatch = null;

            for (const template of templates) {
                for (const rotation of rotations) {
                    const matchResult = new cv.Mat();
                    cv.matchTemplate(rotation.mat, template.mat, matchResult, cv.TM_CCOEFF_NORMED);
                    const confidence = matchResult.data32F[0];
                    matchResult.delete();

                    if (confidence < MATCH_THRESHOLD) {
                        continue;
                    }

                    if (!bestMatch || confidence > bestMatch.confidence) {
                        bestMatch = {
                            templateId: template.id,
                            confidence,
                            rotationDeg: rotation.degrees
                        };
                    }
                }
            }

            for (const rotation of rotations) {
                rotation.mat.delete();
            }

            return bestMatch;
        }

        function updateRotationForTemplate(markerMat, templateId) {
            const templates = getTemplateCandidates();
            const template = templates.find(t => t.id === templateId);
            if (!template) return null;

            const rotations = buildRotations(markerMat);
            let bestRotation = null;

            for (const rotation of rotations) {
                const matchResult = new cv.Mat();
                cv.matchTemplate(rotation.mat, template.mat, matchResult, cv.TM_CCOEFF_NORMED);
                const confidence = matchResult.data32F[0];
                matchResult.delete();

                if (confidence >= MATCH_THRESHOLD && (!bestRotation || confidence > bestRotation.confidence)) {
                    bestRotation = { rotationDeg: rotation.degrees, confidence };
                }
            }

            for (const rotation of rotations) {
                rotation.mat.delete();
            }

            return bestRotation;
        }

        function pruneStaleTracks() {
            for (const [key, track] of tracks.entries()) {
                if (frameNumber - track.lastSeen > config.trackStaleFrames) {
                    track.approx.delete();
                    tracks.delete(key);
                    if (window.arOverlay) {
                        window.arOverlay.removeOverlayMesh(key);
                    }
                }
            }
        }

        function warpAndCheckMarker(approx, originalSrc) {
            const ordered = orderPoints(approx);
            const srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
                ordered[0].x, ordered[0].y,
                ordered[1].x, ordered[1].y,
                ordered[2].x, ordered[2].y,
                ordered[3].x, ordered[3].y,
            ]);
            const dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
                0,                 0,
                config.warpSize-1, 0,
                config.warpSize-1, config.warpSize-1,
                0,                 config.warpSize-1,
            ]);

            const M = cv.getPerspectiveTransform(srcPts, dstPts);
            const warped = new cv.Mat();
            cv.warpPerspective(originalSrc, warped, M, new cv.Size(config.warpSize, config.warpSize));

            if (DEBUG_MODE && originalSrc) {
                const colorWarped = new cv.Mat();
                warped.copyTo(colorWarped);
                addDebugWarp(colorWarped);
                colorWarped.delete();
            }

            srcPts.delete();
            dstPts.delete();
            M.delete();

            return warped;
        }

        function processFrame() {
            if (!window.cv || videoEl.videoWidth === 0 || videoEl.videoHeight === 0) {
                animationId = requestAnimationFrame(processFrame);
                return;
            }

            frameNumber += 1;
            if (frameNumber % config.processEveryNFrames !== 0) {
                animationId = requestAnimationFrame(processFrame);
                return;
            }

            ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

            const frame = ctx.getImageData(0, 0, canvasEl.width, canvasEl.height);
            const src = cv.matFromImageData(frame);
            const gray = new cv.Mat();
            const dst = new cv.Mat();

            debugWarps.length = 0;

            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            const thresholdType = config.useOtsu ? (cv.THRESH_BINARY | cv.THRESH_OTSU) : cv.THRESH_BINARY;
            cv.threshold(gray, gray, config.binaryThreshold, 255, thresholdType);

            const contours = new cv.MatVector();
            const hierarchies = new cv.Mat();
            cv.findContours(gray, contours, hierarchies, cv.RETR_TREE, cv.CHAIN_APPROX_SIMPLE);
            cv.cvtColor(gray, dst, cv.COLOR_GRAY2RGBA);

            const probableMarkers = {};

            for (let i = 0; i < contours.size(); ++i) {
                const contour = contours.get(i);

                const epsilon = config.epsilonCoeff * cv.arcLength(contour, true);
                const approx = new cv.Mat();
                cv.approxPolyDP(contour, approx, epsilon, true);
                contour.delete();
                

                const rect = cv.boundingRect(approx);
                const touchesBorder =
                    rect.x <= config.edgeMarginPx ||
                    rect.y <= config.edgeMarginPx ||
                    rect.x + rect.width >= canvasEl.width - config.edgeMarginPx ||
                    rect.y + rect.height >= canvasEl.height - config.edgeMarginPx;

                if (approx.rows === 4 && cv.contourArea(approx) > config.minArea && cv.isContourConvex(approx) && getSideRatio(approx) <= config.maxSideRatio && !touchesBorder) {
                    
                    
                    const parent = hierarchies.intPtr(0, i)[3];
                    if (parent in probableMarkers) {
                        // probableMarkers[parent].delete();
                        // delete probableMarkers[parent];
                    }else{
                        probableMarkers[i] = approx;
                        
                    }
                } else {
                    approx.delete();
                }
            }

            const claimedTrackIds = new Set();
            for (const id in probableMarkers) {
                const approx = probableMarkers[id];

                // draw contours for debugging
                const debugColor = new cv.Scalar(0, 255, 0, 255);
                const contourVec = new cv.MatVector();
                contourVec.push_back(approx);
                cv.drawContours(dst, contourVec, -1, debugColor, 2, cv.LINE_8);
                contourVec.delete();

                const warped_marker = warpAndCheckMarker(approx, src);

                if (warped_marker !== null) {
                    const center = getApproxCenter(approx);
                    let trackId = findNearestTrackId(center, claimedTrackIds);
                    if (!trackId) {
                        trackId = makeUniqueMarkerId();
                    }
                    claimedTrackIds.add(trackId);

                    updateTrack(trackId, approx, center);
                    const marker = tracks.get(trackId);
                    if (marker.match == null) {
                        const bestMatch = findBestTemplateMatch(warped_marker);
                        if (bestMatch) {
                            marker.match = bestMatch;
                            console.log(
                                `Best match for track ${trackId}: ${bestMatch.templateId} rot=${bestMatch.rotationDeg} conf=${bestMatch.confidence.toFixed(3)}`
                            );
                        }
                        
                    } else {
                        // Update rotation cheaply: only check 4 rotations of the known template
                        const rotUpdate = updateRotationForTemplate(warped_marker, marker.match.templateId);
                        if (rotUpdate) {
                            marker.match.rotationDeg = rotUpdate.rotationDeg;
                            marker.match.confidence = rotUpdate.confidence;
                        }
                    }
                    warped_marker.delete();
                }

                approx.delete();
            }

            pruneStaleTracks();

            let confirmedCount = 0;
            const confirmedIds = [];
            for (const track of tracks.values()) {
                if (track.consecutive >= config.temporalConfirmFrames) {
                    confirmedCount += 1;
                    confirmedIds.push(track.id);
                    const confirmedColor = new cv.Scalar(255, 0, 0, 255);
                    const contourVec = new cv.MatVector();
                    contourVec.push_back(track.approx);
                    cv.drawContours(dst, contourVec, -1, confirmedColor, 3, cv.LINE_8);
                    contourVec.delete();
                }
            }

            // Update Three.js overlays for confirmed tracks
            if (window.arOverlay) {
                for (const track of tracks.values()) {
                    if (track.lastSeen === frameNumber && track.consecutive >= config.temporalConfirmFrames && track.match) {
                        window.arOverlay.updateOverlayPose(track.id, track, canvasEl.width, canvasEl.height);
                    } else {
                        window.arOverlay.hideOverlayMesh(track.id);
                    }
                }
                window.arOverlay.cleanupStaleTracks(new Set(tracks.keys()));
                window.arOverlay.renderThreeOverlay();
            }

            if (confirmedCount > 0) {
                setStatus(`Markers confirmed: ${confirmedCount} [${confirmedIds.join(', ')}]`);
            } else {
                setStatus('Processing video with OpenCV.js');
            }

            if (DEBUG_MODE) {
                drawDebugGrid();
            }

            frame.data.set(dst.data);
            ctx.putImageData(frame, 0, 0);
            drawTrackLabels();

            src.delete();
            gray.delete();
            dst.delete();
            contours.delete();
            hierarchies.delete();

            animationId = requestAnimationFrame(processFrame);
        }

        bindControls();
        syncControls();
    </script>
    <script type="module">
        import { initThreeOverlay, renderThreeOverlay, resizeThreeOverlay, updateOverlayPose, removeOverlayMesh, hideOverlayMesh, cleanupStaleTracks } from '{% static "ar-three-overlay.js" %}';

        // Expose overlay API globally so the non-module processFrame can access it
        window.arOverlay = { initThreeOverlay, renderThreeOverlay, resizeThreeOverlay, updateOverlayPose, removeOverlayMesh, hideOverlayMesh, cleanupStaleTracks };

        // Initialize Three.js overlay with the same fixed render size
        const threeCanvas = document.getElementById('three-canvas');
        initThreeOverlay(threeCanvas, RENDER_WIDTH, RENDER_HEIGHT);
        console.log('Three.js AR overlay initialized', RENDER_WIDTH, 'x', RENDER_HEIGHT);
    </script>
    <script async src="{% static 'opencv-4.13.0.js' %}" onload="onOpenCvReady();" type="text/javascript"></script>
</body>
</html>
